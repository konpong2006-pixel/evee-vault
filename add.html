<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Memory 🤎</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600&family=Playfair+Display:italic,wght@600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Thai', sans-serif; background-color: #FDFBF7; }
        .serif { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="text-[#5D4037] min-h-screen flex flex-col items-center justify-center p-6">

    <div class="w-full max-w-xl bg-white p-8 md:p-12 rounded-[2.5rem] border border-[#E7DCD3] shadow-sm">
        <div class="text-center mb-10">
            <h2 class="serif text-3xl italic text-[#6F4E37] mb-2">New Memory</h2>
            <p class="text-[10px] uppercase tracking-widest text-[#A67B5B]">เพิ่มความทรงจำใหม่</p>
        </div>

        <div class="space-y-6">
            <div>
                <label class="text-[10px] uppercase tracking-[0.2em] text-[#A67B5B] font-bold block mb-2">Image URL (วางลิงก์รูปภาพ)</label>
                <input type="text" id="imageUrlInput" placeholder="https://i.ibb.co/xxxxx/image.jpg" class="w-full p-4 rounded-2xl bg-[#FDFBF7] border border-[#E7DCD3] focus:outline-none focus:ring-1 focus:ring-[#A67B5B] text-sm">
                <p class="text-[9px] text-[#A67B5B] mt-2 italic">* อัปรูปที่ ImgBB แล้วนำ Direct Link มาวางที่นี่นะจ๊ะ</p>
            </div>
            
            <div>
                <label class="text-[10px] uppercase tracking-[0.2em] text-[#A67B5B] font-bold block mb-2">Title (หัวข้อ)</label>
                <input type="text" id="titleInput" placeholder="วันนี้ทำอะไรกันนะ?" class="w-full p-4 rounded-2xl bg-[#FDFBF7] border border-[#E7DCD3] focus:outline-none focus:ring-1 focus:ring-[#A67B5B] text-sm">
            </div>

            <div>
                <label class="text-[10px] uppercase tracking-[0.2em] text-[#A67B5B] font-bold block mb-2">Description (บันทึกสั้นๆ)</label>
                <textarea id="descInput" placeholder="เขียนข้อความถึงกัน..." class="w-full p-4 rounded-2xl bg-[#FDFBF7] border border-[#E7DCD3] focus:outline-none focus:ring-1 focus:ring-[#A67B5B] h-32 text-sm"></textarea>
            </div>

            <button onclick="handleSave()" id="saveBtn" class="w-full py-4 bg-[#6F4E37] text-white rounded-2xl font-bold shadow-lg hover:bg-[#5D4037] transition-all active:scale-95 text-sm tracking-widest uppercase">
                Save to Vault
            </button>
            
            <a href="index.html" class="block text-center text-xs text-[#A67B5B] hover:text-[#6F4E37] transition-colors mt-4 italic underline">
                ← กลับไปหน้า Timeline
            </a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBa7eT4nHVYZfBZw3wStFgBl-Hyw-RsAH0",
            authDomain: "evee-29429.firebaseapp.com",
            projectId: "evee-29429",
            storageBucket: "evee-29429.firebasestorage.app",
            messagingSenderId: "304141311078",
            appId: "1:304141311078:web:a13ea36d278047ef28e1a7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.handleSave = async () => {
            const imageUrl = document.getElementById('imageUrlInput').value;
            const title = document.getElementById('titleInput').value;
            const desc = document.getElementById('descInput').value;
            const btn = document.getElementById('saveBtn');

            if (!imageUrl || !title) return alert("ใส่ลิงก์รูปภาพและหัวข้อด้วยนะจ๊ะ ❤️");
            if (!imageUrl.startsWith('http')) return alert("ลิงก์รูปภาพไม่ถูกต้องจ้ะ (ต้องขึ้นต้นด้วย http)");

            btn.innerText = "SAVING... ⏳";
            btn.disabled = true;

            try {
                // บันทึกข้อมูลลง Firebase โดยตรง
                await addDoc(collection(db, "memories"), {
                    imageUrl: imageUrl,
                    title: title,
                    description: desc,
                    createdAt: new Date()
                });
                
                alert("บันทึกความทรงจำเรียบร้อยแล้ว! ✨");
                window.location.href = "index.html";
            } catch (e) {
                alert("Error: " + e.message);
            } finally {
                btn.innerText = "Save to Vault";
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
